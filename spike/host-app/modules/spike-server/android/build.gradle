plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.triviocity.spike'
version = '0.1.0'

android {
  namespace "com.triviocity.spike"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'org.nanohttpd:nanohttpd:2.3.1'
  implementation 'org.java-websocket:Java-WebSocket:1.6.0'
}
